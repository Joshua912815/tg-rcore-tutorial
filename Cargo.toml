[package]
name = "joshua912815-tg-rcore-tutorial-t2l8"
version = "0.8.0-preview.1"
edition = "2024"
authors = ["Joshua <Joshua912815@users.noreply.github.com>"]
description = "T2L8 engineering-quality rCore tutorial bundle with unified tracing, workloads, regression scripts, and learning docs"
keywords = ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["no-std", "embedded"]
license = "GPL-3.0"
repository = "https://github.com/Joshua912815/tg-rcore-tutorial"
homepage = "https://github.com/Joshua912815/tg-rcore-tutorial/tree/t2l8-crate"
documentation = "https://docs.rs/joshua912815-tg-rcore-tutorial-t2l8"
readme = "README.md"

# Include only necessary files for distribution
include = [
    "Cargo.toml",
    "README.md",
    "report.md",
    "Makefile",
    "LICENSE",
    ".gitignore",
    ".gitmodules",
    "src/**",
    "bundle/submodules.tar.gz",
    "docs/**",
    "scripts/**",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
