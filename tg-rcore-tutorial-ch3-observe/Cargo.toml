[package]
name = "joshua912815-tg-rcore-tutorial-t2l21"
description = "T2L21 observability-focused tg-rCore Chapter 3 experiment crate."
version = "0.21.0-preview.1"
edition = "2024"
authors = ["Joshua <joshua912815@users.noreply.github.com>"]
repository = "https://github.com/Joshua912815/tg-rcore-tutorial"
homepage = "https://github.com/Joshua912815/tg-rcore-tutorial/tree/t2l21-observe/tg-rcore-tutorial-ch3-observe"
documentation = "https://docs.rs/joshua912815-tg-rcore-tutorial-t2l21"
license = "GPL-3.0"
readme = "README.md"
keywords = ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["no-std", "embedded"]
include = [
    ".cargo/config.toml",
    ".gitignore",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "Makefile",
    "README.md",
    "report.md",
    "rust-toolchain.toml",
    "build.rs",
    "exercise.md",
    "src/**",
    "scripts/**",
    "gdb/**",
    "docs/**",
    "test.sh",
    "tg-rcore-tutorial-user/.gitignore",
    "tg-rcore-tutorial-user/Cargo.lock",
    "tg-rcore-tutorial-user/Cargo.toml",
    "tg-rcore-tutorial-user/README.md",
    "tg-rcore-tutorial-user/build.rs",
    "tg-rcore-tutorial-user/cases.toml",
    "tg-rcore-tutorial-user/src/**",
]

[features]
coop = []
exercise = []
crash-demo = []

[[bin]]
name = "tg-rcore-tutorial-ch3-observe"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
riscv = "0.10.1"

tg-sbi = { package = "tg-rcore-tutorial-sbi", version = "=0.4.8", features = ["nobios"] }
tg-linker = { package = "tg-rcore-tutorial-linker", version = "=0.4.8" }
tg-console = { package = "tg-rcore-tutorial-console", version = "=0.4.8" }
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context", version = "=0.4.8" }
tg-syscall = { package = "tg-rcore-tutorial-syscall", version = "=0.4.8", features = ["kernel"] }

[build-dependencies]
tg-linker = { package = "tg-rcore-tutorial-linker", version = "=0.4.8" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
