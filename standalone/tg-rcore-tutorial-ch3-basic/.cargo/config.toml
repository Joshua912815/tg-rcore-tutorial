# 默认编译目标：RISC-V 64 位裸机平台
[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
runner = [
    "qemu-system-riscv64",
    "-machine", "virt",
    "-nographic",
    "-bios", "none",
    "-kernel",
]

[env]
TG_USER_CRATE = "tg-rcore-tutorial-user"
TG_USER_LOCAL_DIR = "vendor/tg-rcore-tutorial-user"
TG_USER_VERSION = "0.4.8"
